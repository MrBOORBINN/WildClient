[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/generate-image"
  to = "/.netlify/functions/generate-image"
  status = 200

[[redirects]]
  from = "/api/credits"
  to = "/.netlify/functions/credits"
  status = 200

[[redirects]]
  from = "/api/credits/*"
  to = "/.netlify/functions/credits"
  status = 200

[[redirects]]
  from = "/api/fetch-url"
  to = "/.netlify/functions/fetch-url"
  status = 200

[[redirects]]
  from = "/api/memories/extract"
  to = "/.netlify/functions/memories-extract"
  status = 200

[[redirects]]
  from = "/api/title"
  to = "/.netlify/functions/title"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
